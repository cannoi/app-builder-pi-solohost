# SoloHost install — Gitea
# Upstream: https://github.com/go-gitea/gitea @ v1.22.3
# License: MIT
# No privileged mode. No docker.sock. Host bind is loopback only.
services:
  app:
    image: ghcr.io/OWNER/gitea:latest
    pull_policy: always
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
