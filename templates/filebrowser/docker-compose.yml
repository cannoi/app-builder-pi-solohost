# SoloHost install — File Browser
# Upstream: https://github.com/filebrowser/filebrowser @ v2.31.2
# License: Apache-2.0
# No privileged mode. No docker.sock. Host bind is loopback only.
services:
  app:
    image: ghcr.io/OWNER/filebrowser:latest
    pull_policy: always
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PORT: "80"
      HOST: "0.0.0.0"
