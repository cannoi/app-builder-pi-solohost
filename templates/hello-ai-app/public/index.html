<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{APP_NAME}}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f141c; color: #eef3fb; }
    main { max-width: 640px; margin: 48px auto; padding: 24px; }
    .card { background: #1a2230; border: 1px solid #2a3546; border-radius: 18px; padding: 24px; }
    .ok { color: #3dd68c; }
  </style>
<style>.paf-made-by{position:fixed;right:8px;bottom:8px;width:min(72px,12vw);max-width:12vw;height:auto;object-fit:contain;opacity:.5;background:transparent;padding:0;border:0;box-shadow:none;filter:none;pointer-events:none;z-index:30}</style></head>
<body>
  <main>
    <div class="card">
      <h1>{{APP_NAME}}</h1>
      <p>{{APP_SUMMARY}}</p>
      <p class="ok" id="health">Checking health…</p>
    </div>
  </main>
  <script>
    fetch('/health').then(r => r.json()).then(j => {
      document.getElementById('health').textContent = j.status === 'ok' ? 'Ready' : 'Needs attention';
    }).catch(() => {
      document.getElementById('health').textContent = 'Needs attention';
    });
  </script>
<img class="paf-made-by" src="public/made-by.png" alt="Made with App Builder — Pi SoloHost"></body>
</html>
