# SoloHost install — standard template std-monitoring-analytics
services:
  app:
    image: ghcr.io/OWNER/std-monitoring-analytics:latest
    pull_policy: always
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    ports:
      - "127.0.0.1:18123:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      APP_NAME: "${APP_NAME:-Monitor Starter}"
