title: "App Builder — Pi SoloHost"
eyebrow: SoloHost App
description: "Build, test, repair, and publish simple SoloHost apps with AI."
footer_hint: "Only enter the important AI and GitHub details you need. Secrets are password fields."
output_file: .env
after_save: "Settings saved. Changes apply automatically to the next Builder task."
fixed_values:
  - name: PREVIEW_MODE
    value: auto
  - name: PODMAN_API_URL
    value: ""
fields:
  - name: BUILDER_ACCESS_PASSWORD
    label: Builder access password
    type: password
    preserve_if_blank: true
    help: "Required to open Builder. Use at least 16 characters and keep it private."

  - name: AI_PROVIDER
    label: AI provider
    type: select
    default: gemini
    options:
      - value: gemini
        label: Gemini
      - value: deepseek
        label: DeepSeek
    help: "Choose the AI service used by the Builder."

  - name: GEMINI_API_KEY
    label: Gemini API key
    type: password
    preserve_if_blank: true
    help: "Required when Gemini is selected. Model selection is automatic."

  - name: DEEPSEEK_API_KEY
    label: DeepSeek API key
    type: password
    preserve_if_blank: true
    help: "Required when DeepSeek is selected."

  - name: GITHUB_OWNER
    label: GitHub owner
    type: text
    preserve_if_blank: true
    help: "Your GitHub username or organization used for publishing."

  - name: GITHUB_TOKEN
    label: GitHub token
    type: password
    preserve_if_blank: true
    help: "Required only for GitHub publishing. Keep this token private."

  - name: SHFH_HUB_URL
    label: Feedback Hub URL
    type: text
    preserve_if_blank: true
    help: "Optional HTTPS origin for the Builder Feedback Hub."

  - name: SHFH_HUB_ID
    label: Feedback Hub ID
    type: text
    preserve_if_blank: true
    help: "Optional Hub identifier. Kept in SoloHost environment, not app code."

  - name: SHFH_INGEST_TOKEN
    label: Feedback Hub ingest token
    type: password
    preserve_if_blank: true
    help: "Optional client-ingest credential. Kept server-side in SoloHost environment."
