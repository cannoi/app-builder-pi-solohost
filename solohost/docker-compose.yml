services:
  app-builder:
    image: ghcr.io/cannoi/app-builder-pi-solohost:1.7.6
    pull_policy: always
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    ports:
      - "127.0.0.1:31881:8080"
    environment:
      BUILDER_ACCESS_PASSWORD: "${BUILDER_ACCESS_PASSWORD}"
      PREVIEW_MODE: "auto"
      PREVIEW_ONLINE: "true"
      HOST_PORT: "31881"
    volumes:
      - builder_data:/app/data
    dns:
      - "8.8.8.8"
      - "1.1.1.1"

volumes:
  builder_data:
