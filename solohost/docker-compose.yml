services:
  app-builder:
    image: ghcr.io/OWNER/source:latest
    pull_policy: always
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    ports:
      - "127.0.0.1:20095:8080"
    environment:
      PREVIEW_MODE: "auto"
      PREVIEW_ONLINE: "true"
      HOST_PORT: "31881"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      ENGINEERING_TOOLKIT: "auto"
      ACCESS_PASSWORD: ${ACCESS_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD}
    volumes:
      - builder_data:/app/data
    dns:
      - "8.8.8.8"
      - "1.1.1.1"

volumes:
  builder_data:
