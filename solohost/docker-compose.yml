services:
  app:
    image: ghcr.io/cannoi/app-builder-pi-solohost:latest
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      BUILDER_ACCESS_PASSWORD: "${BUILDER_ACCESS_PASSWORD}"
      SHFH_HUB_URL: "${SHFH_HUB_URL:-}"
      SHFH_HUB_ID: "${SHFH_HUB_ID:-}"
      SHFH_INGEST_TOKEN: "${SHFH_INGEST_TOKEN:-}"
