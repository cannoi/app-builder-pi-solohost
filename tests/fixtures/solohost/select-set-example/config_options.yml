title: "Select set example"
output_file: .env
fields:
  - name: MODE
    type: select
    default: "cloud"
    options:
      - value: cloud
        label: Cloud
        set:
          BASE_URL: "https://api.example.com"
      - value: local
        label: Local
        set:
          BASE_URL: "http://127.0.0.1:11434"
  - name: BASE_URL
    type: hidden
    default: "https://api.example.com"
