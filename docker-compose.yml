services:
  app-builder:
    image: ghcr.io/cannoi/app-builder-pi-solohost:latest
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    ports:
      - "127.0.0.1:18781:8080"
    environment:
      AI_PROVIDER: "${AI_PROVIDER}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      GITHUB_OWNER: "${GITHUB_OWNER}"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      PREVIEW_MODE: "auto"
      PODMAN_API_URL: ""
