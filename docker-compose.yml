services:
  app-builder:
    image: ghcr.io/cannoi/app-builder-pi-solohost:latest
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    ports:
      - "127.0.0.1:18781:8080"
    environment:
      BUILDER_ACCESS_PASSWORD: "${BUILDER_ACCESS_PASSWORD}"
      AI_PROVIDER: "${AI_PROVIDER}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      GITHUB_OWNER: "${GITHUB_OWNER}"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      SHFH_HUB_URL: "${SHFH_HUB_URL:-}"
      SHFH_HUB_ID: "${SHFH_HUB_ID:-}"
      SHFH_INGEST_TOKEN: "${SHFH_INGEST_TOKEN:-}"
      PREVIEW_MODE: "auto"
      PREVIEW_ONLINE: "true"
    dns:
      - "8.8.8.8"
      - "1.1.1.1"
