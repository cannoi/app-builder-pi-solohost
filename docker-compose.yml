services:
  app-builder:
    image: ghcr.io/cannoi/app-builder-pi-solohost:1.8.6
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    ports:
      - "127.0.0.1:18781:8080"
    environment:
      AI_PROVIDER: "${AI_PROVIDER}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      GITHUB_OWNER: "${GITHUB_OWNER}"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      PREVIEW_MODE: "${PREVIEW_MODE}"
      PUBLIC_URL: "${PUBLIC_URL}"
      BUILDER_ACCESS_PASSWORD: "${BUILDER_ACCESS_PASSWORD}"
      PREVIEW_ONLINE: "true"
    volumes:
      - builder_data:/app/data
    dns:
      - "8.8.8.8"
      - "1.1.1.1"

volumes:
  builder_data:
